<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unblock.ai</title>
  <link rel="stylesheet" href="style.css">
  <!-- Markdown Parser Library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h2>unblock.ai</h2>
    </header>

    <div id="chat-box"></div>

    <div class="prompt-bar">
      <button class="plus-btn" aria-label="Add attachment">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask unblock.ai" 
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <div class="pill-actions">
        <div class="model-selector">
          <span id="model-label">Ling 3.0 Flash</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <button id="send-btn" onclick="sendMessage()" aria-label="Send prompt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
